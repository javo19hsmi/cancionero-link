<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyector Parroquial en Vivo 🕊️</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Montserrat:wght@400;600;700&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;600&family=Quicksand:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body {
      margin: 0; padding: 0;
      background-color: #050505; color: #FFFFFF;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      min-height: 100vh; text-align: center;
      overflow: hidden; position: relative;
      background-size: cover; background-position: center;
      background-repeat: no-repeat;
      transition: background 0.4s ease-in-out, background-color 0.4s ease-in-out;
    }

    /* FONDO BLUR DESENFOCADO DE DETRÁS (Efecto TV Blur) */
    #bg-blur-container {
      position: absolute; top: -5%; left: -5%; width: 110%; height: 110%;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      filter: blur(28px) brightness(0.5);
      z-index: 1; display: none; opacity: 0.9;
    }

    /* VELO DE OSCURECIMIENTO SOBRE EL FONDO */
    #bg-overlay-div {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0);
      z-index: 2; pointer-events: none;
      transition: background-color 0.3s ease;
    }

    /* PANTALLA NEGRA TOTAL (Apagón) */
    body.pantalla-negra {
      background: #000000 !important;
      background-image: none !important;
    }
    body.pantalla-negra * {
      display: none !important;
    }

    /* POSICIONAMIENTO DINÁMICO DEL NOMBRE DE PARROQUIA */
    .parroquia-box {
      position: absolute;
      font-size: 1.1rem; color: #888888; font-weight: bold;
      text-transform: uppercase; letter-spacing: 1px;
      transition: all 0.3s ease; z-index: 10;
      line-height: 1.25; text-align: left;
    }
    .parroquia-subtext {
      font-size: 0.78em; color: rgba(255,255,255,0.85); font-weight: normal;
      text-transform: none; letter-spacing: 0px; margin-top: 2px;
    }

    /* POSICIONES DE PARROQUIA */
    .pos-top-left { top: 25px; left: 35px; right: auto; bottom: auto; text-align: left; }
    .pos-top-right { top: 25px; right: 35px; left: auto; bottom: auto; text-align: right; }
    .pos-bottom-left { bottom: 25px; left: 35px; right: auto; top: auto; text-align: left; }
    .pos-bottom-right { bottom: 25px; right: 35px; left: auto; top: auto; text-align: right; }
    .pos-bottom-center { bottom: 25px; left: 50%; transform: translateX(-50%); right: auto; top: auto; text-align: center; }
    .pos-hidden { display: none !important; }

    .cancion-title {
      position: absolute; top: 35px;
      font-size: 2.2rem; color: #4DB6AC; font-weight: bold;
      letter-spacing: 1px; width: 80%; margin: 0 auto;
      transition: opacity 0.3s ease; z-index: 10;
    }

    #contenido {
      width: 100%;
      max-width: 90%;
      margin: 0 auto;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 10;
    }

    .bloque-texto {
      font-size: 3.8rem; line-height: 1.35; font-weight: bold;
      max-width: 88%; margin: 0 auto; padding-top: 40px;
      white-space: pre-wrap;
    }
    .bloque-texto b { color: inherit; }
    .bloque-texto i { font-style: italic; opacity: 0.9; }

    .footer-left { position: absolute; bottom: 25px; left: 35px; font-size: 1.2rem; color: #888; font-weight: bold; z-index: 10; }
    .footer-right { position: absolute; bottom: 25px; right: 35px; font-size: 1.1rem; color: #FFD700; font-weight: bold; opacity: 0.85; z-index: 10; }

    .btn-fs {
      position: absolute; top: 20px; right: 25px;
      background: rgba(255,255,255,0.1); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
      padding: 6px 12px; font-size: 0.85rem; cursor: pointer;
      transition: opacity 0.3s; z-index: 999;
    }
    .btn-fs:hover { opacity: 1; background: rgba(255,255,255,0.25); }

    /* ANIMACIONES DE TRANSICIÓN EXTENDIDAS */
    .fade-out { opacity: 0 !important; }
    .slide-out { transform: translateY(-30px); opacity: 0 !important; }
    .slide-horizontal-out { transform: translateX(-40px); opacity: 0 !important; }
    .zoom-out { transform: scale(0.85); opacity: 0 !important; }
    .fade-up-out { transform: translateY(20px); opacity: 0 !important; }
  </style>
</head>
<body id="cuerpo" onclick="toggleFS()">
  <div id="bg-blur-container"></div>
  <div id="bg-overlay-div"></div>

  <button id="btnFS" class="btn-fs" onclick="toggleFS(); event.stopPropagation();">⛶ Pantalla Completa (F11)</button>
  <div id="header-parroquia" class="parroquia-box pos-top-left">
    <div id="parroquia-nombre-text">Parroquia</div>
    <div id="parroquia-subtext-text" class="parroquia-subtext" style="display:none;"></div>
  </div>
  <div id="cancion-header" class="cancion-title" style="display:none;"></div>

  <div id="contenido">
    <div id="texto-principal" class="bloque-texto">Sintonizando proyector...</div>
  </div>

  <div id="footer-page" class="footer-left"></div>
  <div id="footer-app" class="footer-right">Cancionero Parroquial 🕊️</div>

  <script>
    function escapeHtml(t) {
      if (!t) return "";
      return t
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function darFormato(t) {
      if (!t) return "";
      let safe = escapeHtml(t);
      return safe
        .replace(/\{.*?\}/g, "")
        .replace(/\[.*?\]/g, "")
        .replace(/\*\*_([\s\S]*?)_\*\*/g, "<i><b>$1</b></i>")
        .replace(/\*\*([\s\S]*?)\*\*/g, "<b>$1</b>")
        .replace(/_([\s\S]*?)_/g, "<i>$1</i>");
    }

    function toggleFS() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('btnFS');
      if (btn) {
        btn.style.display = document.fullscreenElement ? 'none' : 'block';
      }
    });

    firebase.initializeApp({ databaseURL: "https://cancionero-parroquial-269d0-default-rtdb.firebaseio.com/" });
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    let comunidadPath = urlParams.get('comunidad') || 'comunidades/san_cayetano';
    if (!comunidadPath.startsWith('comunidades/')) {
      comunidadPath = 'comunidades/' + comunidadPath;
    }

    let customParroquiaNombre = "";
    let customParroquiaSubtitulo = "";
    let currentTransicion = "fade";
    let currentVelocidad = "0.5s";

    function aplicarFondoCompleto(fondo, imagenBg, fit, pos, overlay) {
      const cuerpo = document.getElementById('cuerpo');
      const blurBox = document.getElementById('bg-blur-container');
      const overlayBox = document.getElementById('bg-overlay-div');

      const overlayAlpha = parseFloat(overlay) || 0;
      overlayBox.style.backgroundColor = `rgba(0,0,0, ${overlayAlpha})`;

      if (fondo === 'custom' && imagenBg) {
        const fitVal = fit || 'cover';
        const posVal = pos || 'center center';

        if (fitVal === 'blur') {
          blurBox.style.display = 'block';
          blurBox.style.backgroundImage = `url("${imagenBg}")`;
          cuerpo.style.backgroundImage = `url("${imagenBg}")`;
          cuerpo.style.backgroundSize = 'contain';
          cuerpo.style.backgroundPosition = posVal;
          cuerpo.style.backgroundColor = 'transparent';
        } else {
          blurBox.style.display = 'none';
          cuerpo.style.backgroundImage = `url("${imagenBg}")`;
          cuerpo.style.backgroundSize = fitVal;
          cuerpo.style.backgroundPosition = posVal;
          cuerpo.style.backgroundColor = 'transparent';
        }
      } else {
        blurBox.style.display = 'none';
        if (fondo && fondo.startsWith('linear-gradient')) {
          cuerpo.style.background = fondo;
        } else if (fondo) {
          cuerpo.style.backgroundColor = fondo;
          cuerpo.style.backgroundImage = 'none';
        }
      }
    }

    function aplicarPosicionParroquia(pos) {
      const box = document.getElementById('header-parroquia');
      box.className = 'parroquia-box';
      const posClass = 'pos-' + (pos || 'top-left');
      box.classList.add(posClass);
    }

    function aplicarEstilosBase(cfg) {
      if (!cfg) return;
      const cancionHeader = document.getElementById('cancion-header');
      const texto = document.getElementById('texto-principal');
      const headerParroquia = document.getElementById('header-parroquia');
      const parName = document.getElementById('parroquia-nombre-text');
      const parSub = document.getElementById('parroquia-subtext-text');

      aplicarFondoCompleto(cfg.fondo, cfg.imagenBg, cfg.imagenFit, cfg.imagenPosition, cfg.imagenOverlay);
      aplicarPosicionParroquia(cfg.posicionParroquia);

      if (cfg.fuenteParroquia) headerParroquia.style.fontFamily = cfg.fuenteParroquia;
      else if (cfg.fuente) headerParroquia.style.fontFamily = cfg.fuente;

      if (cfg.fuenteTitulo) cancionHeader.style.fontFamily = cfg.fuenteTitulo;
      else if (cfg.fuente) cancionHeader.style.fontFamily = cfg.fuente;

      if (cfg.fuenteTexto) texto.style.fontFamily = cfg.fuenteTexto;
      else if (cfg.fuente) texto.style.fontFamily = cfg.fuente;

      if (cfg.tamano) texto.style.fontSize = cfg.tamano;
      if (cfg.tamanoTitulo) cancionHeader.style.fontSize = cfg.tamanoTitulo;
      if (cfg.tamanoParroquia) headerParroquia.style.fontSize = cfg.tamanoParroquia;

      if (cfg.colorTitulo) cancionHeader.style.color = cfg.colorTitulo;
      if (cfg.colorTexto) texto.style.color = cfg.colorTexto;
      if (cfg.colorParroquia) headerParroquia.style.color = cfg.colorParroquia;

      if (cfg.transicion) currentTransicion = cfg.transicion;
      if (cfg.velocidad) currentVelocidad = cfg.velocidad;

      if (cfg.nombreParroquia) {
        customParroquiaNombre = cfg.nombreParroquia;
        parName.innerText = cfg.nombreParroquia;
      }
      if (cfg.subtituloParroquia !== undefined) {
        customParroquiaSubtitulo = cfg.subtituloParroquia || "";
        if (customParroquiaSubtitulo) {
          parSub.style.display = 'block';
          parSub.innerText = customParroquiaSubtitulo;
        } else {
          parSub.style.display = 'none';
        }
      }
    }

    // Escuchar configuración persistente de la Nube
    db.ref(comunidadPath + '/proyector_config').on('value', s => {
      aplicarEstilosBase(s.val());
    });

    // Transición suave al actualizar diapositiva con 6 animaciones
    function actualizarContenidoConTransicion(updateFn, trans, vel) {
      const contenido = document.getElementById('contenido');
      const durMs = parseFloat(vel || "0.5s") * 1000 || 500;

      if (trans === 'none') {
        updateFn();
        return;
      }

      let outClass = 'fade-out';
      if (trans === 'slide') outClass = 'slide-out';
      else if (trans === 'slide-horizontal') outClass = 'slide-horizontal-out';
      else if (trans === 'zoom') outClass = 'zoom-out';
      else if (trans === 'fade-up') outClass = 'fade-up-out';

      contenido.style.transition = `opacity ${durMs / 2}ms ease, transform ${durMs / 2}ms ease`;
      contenido.classList.add(outClass);

      setTimeout(() => {
        updateFn();
        contenido.classList.remove(outClass);
      }, durMs / 2);
    }

    // Escuchar la transmisión EN VIVO
    db.ref(comunidadPath + '/proyeccion_vivo').on('value', snapshot => {
      const data = snapshot.val();
      const cuerpo = document.getElementById('cuerpo');
      const headerParroquia = document.getElementById('header-parroquia');
      const parName = document.getElementById('parroquia-nombre-text');
      const parSub = document.getElementById('parroquia-subtext-text');
      const cancionHeader = document.getElementById('cancion-header');
      const texto = document.getElementById('texto-principal');
      const footerPage = document.getElementById('footer-page');

      if (!data) {
        cuerpo.className = '';
        parName.innerText = customParroquiaNombre || "Comunidad Sintonizada";
        texto.innerHTML = "Bienvenidos a la Santa Misa 🕊️";
        return;
      }

      // MODO PANTALLA NEGRA (APAGÓN COMPLETO)
      if (data.modo === 'NEGRA') {
        cuerpo.className = 'pantalla-negra';
        return;
      }

      cuerpo.className = '';

      // Aplicar fondo completo con encuadre, blur y filtro
      aplicarFondoCompleto(data.fondo, data.imagenBg, data.imagenFit, data.imagenPosition, data.imagenOverlay);
      aplicarPosicionParroquia(data.posicionParroquia);

      // Tipografías, Tamaños y Colores Independientes
      if (data.fuenteParroquia) headerParroquia.style.fontFamily = data.fuenteParroquia;
      else if (data.fuente) headerParroquia.style.fontFamily = data.fuente;

      if (data.fuenteTitulo) cancionHeader.style.fontFamily = data.fuenteTitulo;
      else if (data.fuente) cancionHeader.style.fontFamily = data.fuente;

      if (data.tamanoTitulo) cancionHeader.style.fontSize = data.tamanoTitulo;
      if (data.tamanoParroquia) headerParroquia.style.fontSize = data.tamanoParroquia;

      if (data.colorTitulo) cancionHeader.style.color = data.colorTitulo;
      if (data.colorParroquia) headerParroquia.style.color = data.colorParroquia;

      const trans = data.transicion || currentTransicion;
      const vel = data.velocidad || currentVelocidad;

      actualizarContenidoConTransicion(() => {
        parName.innerText = customParroquiaNombre || data.comunidadNombre || 'Parroquia';
        if (data.subtituloParroquia || customParroquiaSubtitulo) {
          parSub.style.display = 'block';
          parSub.innerText = data.subtituloParroquia || customParroquiaSubtitulo;
        } else {
          parSub.style.display = 'none';
        }

        if (data.modo === 'BIENVENIDA') {
          cancionHeader.style.display = 'none';
          texto.style.fontFamily = data.fuenteBienvenida || data.fuenteTexto || data.fuente || 'sans-serif';
          texto.style.fontSize = data.tamanoBienvenida || data.tamano || '3.8rem';
          texto.style.color = data.colorBienvenida || data.colorTexto || '#FFFFFF';
          texto.innerHTML = darFormato(data.titulo || 'Bienvenidos a la Santa Misa 🕊️');
          footerPage.innerText = '';
        } else {
          cancionHeader.style.display = 'block';
          cancionHeader.innerText = data.titulo || '';
          texto.style.fontFamily = data.fuenteTexto || data.fuente || 'sans-serif';
          texto.style.fontSize = data.tamano || '3.8rem';
          texto.style.color = data.colorTexto || '#FFFFFF';
          texto.innerHTML = darFormato(data.bloqueTexto || '');
          if (data.totalBloques > 0) {
            footerPage.innerText = (data.bloqueIndex + 1) + ' / ' + data.totalBloques;
          } else {
            footerPage.innerText = '';
          }
        }
      }, trans, vel);
    });
  </script>
</body>
</html>
