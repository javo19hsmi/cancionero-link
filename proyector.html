<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyector Parroquial en Vivo 🕊️</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body {
      margin: 0; padding: 0;
      background-color: #050505; color: #FFFFFF;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      min-height: 100vh; text-align: center;
      overflow: hidden; position: relative;
      background-size: cover; background-position: center;
      transition: background 0.4s ease-in-out, background-color 0.4s ease-in-out;
    }

    /* PANTALLA NEGRA TOTAL (Apagón) */
    body.pantalla-negra {
      background: #000000 !important;
      background-image: none !important;
    }
    body.pantalla-negra * {
      display: none !important;
    }

    .top-left-parroquia {
      position: absolute; top: 25px; left: 35px;
      font-size: 1.1rem; color: #888888; font-weight: bold;
      text-transform: uppercase; letter-spacing: 1px;
      transition: opacity 0.3s ease;
    }

    .cancion-title {
      position: absolute; top: 35px;
      font-size: 2.2rem; color: #4DB6AC; font-weight: bold;
      letter-spacing: 1px; width: 80%; margin: 0 auto;
      transition: opacity 0.3s ease;
    }

    #contenido {
      width: 100%;
      max-width: 90%;
      margin: 0 auto;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .bloque-texto {
      font-size: 3.8rem; line-height: 1.35; font-weight: bold;
      max-width: 88%; margin: 0 auto; padding-top: 40px;
    }
    .bloque-texto b { color: inherit; }
    .bloque-texto i { font-style: italic; opacity: 0.9; }

    .footer-left { position: absolute; bottom: 25px; left: 35px; font-size: 1.2rem; color: #888; font-weight: bold; }
    .footer-right { position: absolute; bottom: 25px; right: 35px; font-size: 1.1rem; color: #FFD700; font-weight: bold; opacity: 0.85; }

    .btn-fs {
      position: absolute; top: 20px; right: 25px;
      background: rgba(255,255,255,0.1); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
      padding: 6px 12px; font-size: 0.85rem; cursor: pointer;
      transition: opacity 0.3s; z-index: 999;
    }
    .btn-fs:hover { opacity: 1; background: rgba(255,255,255,0.25); }

    /* Clases para animación de transición */
    .fade-out { opacity: 0 !important; }
    .slide-out { transform: translateY(-20px); opacity: 0 !important; }
  </style>
</head>
<body id="cuerpo" onclick="toggleFS()">
  <button id="btnFS" class="btn-fs" onclick="toggleFS(); event.stopPropagation();">⛶ Pantalla Completa (F11)</button>
  <div id="header-parroquia" class="top-left-parroquia">Parroquia</div>
  <div id="cancion-header" class="cancion-title" style="display:none;"></div>

  <div id="contenido">
    <div id="texto-principal" class="bloque-texto">Sintonizando proyector...</div>
  </div>

  <div id="footer-page" class="footer-left"></div>
  <div id="footer-app" class="footer-right">Cancionero Parroquial 🕊️</div>

  <script>
    // Escapar HTML para prevenir inyecciones y dar formato seguro
    function escapeHtml(t) {
      if (!t) return "";
      return t
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function darFormato(t) {
      if (!t) return "";
      let safe = escapeHtml(t);
      return safe
        .replace(/\{.*?\}/g, "")
        .replace(/\[.*?\]/g, "")
        .replace(/\*\*_([\s\S]*?)_\*\*/g, "<i><b>$1</b></i>")
        .replace(/\*\*([\s\S]*?)\*\*/g, "<b>$1</b>")
        .replace(/_([\s\S]*?)_/g, "<i>$1</i>");
    }

    function toggleFS() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('btnFS');
      if (btn) {
        btn.style.display = document.fullscreenElement ? 'none' : 'block';
      }
    });

    firebase.initializeApp({ databaseURL: "https://cancionero-parroquial-269d0-default-rtdb.firebaseio.com/" });
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    let comunidadPath = urlParams.get('comunidad') || 'comunidades/san_cayetano';
    if (!comunidadPath.startsWith('comunidades/')) {
      comunidadPath = 'comunidades/' + comunidadPath;
    }

    let customParroquiaNombre = "";
    let currentTransicion = "fade";
    let currentVelocidad = "0.5s";

    function aplicarEstilosBase(cfg) {
      if (!cfg) return;
      const cuerpo = document.getElementById('cuerpo');
      const cancionHeader = document.getElementById('cancion-header');
      const texto = document.getElementById('texto-principal');
      const headerParroquia = document.getElementById('header-parroquia');

      if (cfg.fondo) {
        if (cfg.fondo === 'custom' && cfg.imagenBg) {
          cuerpo.style.backgroundImage = `url("${cfg.imagenBg}")`;
          cuerpo.style.backgroundSize = 'cover';
          cuerpo.style.backgroundPosition = 'center';
          cuerpo.style.backgroundColor = 'transparent';
        } else if (cfg.fondo.startsWith('linear-gradient')) {
          cuerpo.style.background = cfg.fondo;
        } else {
          cuerpo.style.backgroundColor = cfg.fondo;
          cuerpo.style.backgroundImage = 'none';
        }
      }

      // Tipografías independientes
      if (cfg.fuenteParroquia) headerParroquia.style.fontFamily = cfg.fuenteParroquia;
      else if (cfg.fuente) headerParroquia.style.fontFamily = cfg.fuente;

      if (cfg.fuenteTitulo) cancionHeader.style.fontFamily = cfg.fuenteTitulo;
      else if (cfg.fuente) cancionHeader.style.fontFamily = cfg.fuente;

      if (cfg.fuenteTexto) texto.style.fontFamily = cfg.fuenteTexto;
      else if (cfg.fuente) texto.style.fontFamily = cfg.fuente;

      if (cfg.tamano) texto.style.fontSize = cfg.tamano;
      if (cfg.tamanoTitulo) cancionHeader.style.fontSize = cfg.tamanoTitulo;
      if (cfg.tamanoParroquia) headerParroquia.style.fontSize = cfg.tamanoParroquia;

      if (cfg.colorTitulo) cancionHeader.style.color = cfg.colorTitulo;
      if (cfg.colorTexto) texto.style.color = cfg.colorTexto;
      if (cfg.colorParroquia) headerParroquia.style.color = cfg.colorParroquia;

      if (cfg.transicion) currentTransicion = cfg.transicion;
      if (cfg.velocidad) currentVelocidad = cfg.velocidad;

      if (cfg.nombreParroquia) {
        customParroquiaNombre = cfg.nombreParroquia;
        headerParroquia.innerText = cfg.nombreParroquia;
      }
    }

    // Escuchar configuración persistente de la Nube
    db.ref(comunidadPath + '/proyector_config').on('value', s => {
      aplicarEstilosBase(s.val());
    });

    // Transición suave al actualizar diapositiva
    function actualizarContenidoConTransicion(updateFn, trans, vel) {
      const contenido = document.getElementById('contenido');
      const durMs = parseFloat(vel || "0.5s") * 1000 || 500;

      if (trans === 'none') {
        updateFn();
        return;
      }

      const outClass = (trans === 'slide') ? 'slide-out' : 'fade-out';
      contenido.style.transition = `opacity ${durMs / 2}ms ease, transform ${durMs / 2}ms ease`;
      contenido.classList.add(outClass);

      setTimeout(() => {
        updateFn();
        contenido.classList.remove(outClass);
      }, durMs / 2);
    }

    // Escuchar la transmisión EN VIVO (lo que envía el operador al pulsar "Enviar al Cañón")
    db.ref(comunidadPath + '/proyeccion_vivo').on('value', snapshot => {
      const data = snapshot.val();
      const cuerpo = document.getElementById('cuerpo');
      const headerParroquia = document.getElementById('header-parroquia');
      const cancionHeader = document.getElementById('cancion-header');
      const texto = document.getElementById('texto-principal');
      const footerPage = document.getElementById('footer-page');

      if (!data) {
        cuerpo.className = '';
        headerParroquia.innerText = customParroquiaNombre || "Comunidad Sintonizada";
        texto.innerHTML = "Bienvenidos a la Santa Misa 🕊️";
        return;
      }

      // MODO PANTALLA NEGRA (APAGÓN COMPLETO)
      if (data.modo === 'NEGRA') {
        cuerpo.className = 'pantalla-negra';
        return;
      }

      cuerpo.className = '';

      // Aplicar fondo
      if (data.fondo) {
        if (data.fondo === 'custom' && data.imagenBg) {
          cuerpo.style.backgroundImage = `url("${data.imagenBg}")`;
          cuerpo.style.backgroundSize = 'cover';
          cuerpo.style.backgroundPosition = 'center';
          cuerpo.style.backgroundColor = 'transparent';
        } else if (data.fondo.startsWith('linear-gradient')) {
          cuerpo.style.background = data.fondo;
        } else {
          cuerpo.style.backgroundColor = data.fondo;
          cuerpo.style.backgroundImage = 'none';
        }
      }

      // Tipografías, Tamaños y Colores Independientes
      if (data.fuenteParroquia) headerParroquia.style.fontFamily = data.fuenteParroquia;
      else if (data.fuente) headerParroquia.style.fontFamily = data.fuente;

      if (data.fuenteTitulo) cancionHeader.style.fontFamily = data.fuenteTitulo;
      else if (data.fuente) cancionHeader.style.fontFamily = data.fuente;

      if (data.tamanoTitulo) cancionHeader.style.fontSize = data.tamanoTitulo;
      if (data.tamanoParroquia) headerParroquia.style.fontSize = data.tamanoParroquia;

      if (data.colorTitulo) cancionHeader.style.color = data.colorTitulo;
      if (data.colorParroquia) headerParroquia.style.color = data.colorParroquia;

      const trans = data.transicion || currentTransicion;
      const vel = data.velocidad || currentVelocidad;

      actualizarContenidoConTransicion(() => {
        headerParroquia.innerText = customParroquiaNombre || data.comunidadNombre || 'Parroquia';

        if (data.modo === 'BIENVENIDA') {
          cancionHeader.style.display = 'none';
          texto.style.fontFamily = data.fuenteBienvenida || data.fuenteTexto || data.fuente || 'sans-serif';
          texto.style.fontSize = data.tamanoBienvenida || data.tamano || '3.8rem';
          texto.style.color = data.colorBienvenida || data.colorTexto || '#FFFFFF';
          texto.innerHTML = darFormato(data.titulo || 'Bienvenidos a la Santa Misa 🕊️');
          footerPage.innerText = '';
        } else {
          cancionHeader.style.display = 'block';
          cancionHeader.innerText = data.titulo || '';
          texto.style.fontFamily = data.fuenteTexto || data.fuente || 'sans-serif';
          texto.style.fontSize = data.tamano || '3.8rem';
          texto.style.color = data.colorTexto || '#FFFFFF';
          texto.innerHTML = darFormato(data.bloqueTexto || '');
          if (data.totalBloques > 0) {
            footerPage.innerText = (data.bloqueIndex + 1) + ' / ' + data.totalBloques;
          } else {
            footerPage.innerText = '';
          }
        }
      }, trans, vel);
    });
  </script>
</body>
</html>
