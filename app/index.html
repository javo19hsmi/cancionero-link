  <!-- 🔔 HELPER NOTIFICACIONES ESCRITORIO HTML5 (Para Pestaña Minimizada) -->
  <script>
    window.showWebDesktopNotification = function(title, body) {
      if (!("Notification" in window)) return;
      if (Notification.permission === "granted") {
        try {
          var notif = new Notification(title, {
            body: body,
            icon: "favicon.png"
          });
          notif.onclick = function() {
            window.focus();
          };
        } catch (e) {
          console.warn("Error mostrando notificación de escritorio:", e);
        }
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(function (permission) {
          if (permission === "granted") {
            window.showWebDesktopNotification(title, body);
          }
        });
      }
    };
