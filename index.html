<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancionero Parroquial 🕊️</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    :root { 
      --primary: #00695C; 
      --primary-light: #4DB6AC;
      --bg: #121212; 
      --card: #1A1A1A; 
      --surface: #222222;
      --text: #E0E0E0; 
      --border: #2C2C2C;
      --live-red: #ff5252;
    }
    body.light-mode {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --surface: #F1F5F9;
      --text: #0F172A;
      --border: #E2E8F0;
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg); color: var(--text);
      margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
      transition: background-color 0.3s, color 0.3s;
    }
    .container { padding: 16px; max-width: 500px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .header-area { text-align: center; flex: 1; }
    .header-area h1 { font-size: 1.3rem; color: var(--primary-light); margin: 0; text-transform: uppercase; font-weight: bold; }
    .live-badge { font-size: 0.82rem; color: #888; font-weight: bold; margin-top: 4px; transition: color 0.3s; }
    .live-badge.active { color: var(--live-red); }

    .theme-switch-btn {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 10px; font-size: 0.75rem; font-weight: bold;
      cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s;
    }

    .status-card { background: var(--card); padding: 18px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .zoom-controls { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 8px 16px; border-radius: 12px; margin-bottom: 16px; }
    .zoom-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    .lyrics-view { text-align: left; line-height: 1.7; font-size: 1.25rem; padding: 10px 4px; }
    
    .bloque { padding: 12px; border-radius: 8px; margin-bottom: 8px; transition: all 0.3s ease; border-left: 4px solid transparent; white-space: normal; }
    br.espacio-estrofa { content: ""; margin-bottom: 14px; display: block; }
    .bloque.active { background: rgba(77, 182, 172, 0.15); border-left-color: var(--primary-light); color: var(--text); font-weight: bold; transform: translateX(4px); }
    .bloque b { color: var(--primary-light); font-weight: 700; }
    
    .download-group { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .btn-download { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 12px; background-color: var(--primary); color: white; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 0.9rem; transition: transform 0.2s; }
    .btn-download.btn-ios { background-color: #0284C7; }
  </style>
</head>
<body>
  <div id="portal" class="container">
    <div id="loader" class="status-card" style="text-align:center; padding:60px 20px;">
      <h2>Cargando portal...</h2>
      <p style="color: #888;">Conectando con la celebración...</p>
    </div>
    <div id="main-view" style="display:none;">
      <div class="top-bar">
        <div class="header-area">
          <h1 id="comm-name">Parroquia</h1>
          <div id="live-indicator" class="live-badge">● TRANSMISIÓN INACTIVA</div>
        </div>
        <button id="theme-toggle-btn" class="theme-switch-btn" onclick="toggleTheme()">☀️ Claro</button>
      </div>
      <br>
      <div class="status-card">
        <div class="zoom-controls">
          <button class="zoom-btn" onclick="changeZoom(-1)">A-</button>
          <span style="color:#888; font-size:0.85rem; font-weight:bold;">Tamaño Letra</span>
          <button class="zoom-btn" onclick="changeZoom(1)">A+</button>
        </div>
        <div id="waiting-msg" style="text-align:center; padding:40px 20px;">
          <h2 id="waiting-title" style="color:var(--primary-light)">Conectado 💒</h2>
          <p id="status-text" style="color: #888;">Esperando la celebración 🕒</p>
        </div>
        <div id="lyrics-display" class="lyrics-view" style="display:none;"></div>
      </div>
    </div>
    <div class="download-group">
      <a href="https://drive.google.com/file/d/1Ueg7P2rlZxYpF8E_CJ3qn0_KLJE3ru9c/view?usp=drive_link" target="_blank" class="btn-download">🤖 Descargar App Android (APK)</a>
      <a href="https://javo19hsmi.github.io/cancionero-link/app/" target="_blank" class="btn-download btn-ios">🍎 Instalar App Web iOS / PWA</a>
    </div>
  </div>

  <script>
    const SCHEME = "cancionero-pst";
    const FALLBACK = "https://drive.google.com/file/d/1Ueg7P2rlZxYpF8E_CJ3qn0_KLJE3ru9c/view?usp=drive_link";
    
    firebase.initializeApp({ databaseURL: "https://cancionero-parroquial-269d0-default-rtdb.firebaseio.com/" });
    const db = firebase.database();

    const hash = decodeURIComponent(window.location.hash.substring(1));
    if (hash) {
      // 1. SI ES UN LINK PARA ABRIR LA APP CON UNA MISA (cancionero-pst://)
      if (hash.startsWith('cancionero-pst://')) {
        // Intentamos disparar el esquema para que abra la app en el celular
        window.location.href = hash;

        // Opcional: Si querés que la web también extraiga la información 
        // de la URL (como los nombres y las canciones) para mostrarlas en pantalla:
        try {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('main-view').style.display = 'block';
          
          // Extraemos los parámetros de la URL interna (ej: nombre y lista de canciones)
          const urlObj = new URL(hash.replace('cancionero-pst://', 'http://dummy/'));
          const nombreMisa = urlObj.searchParams.get('nombre') || "Misa Compartida";
          const idsCanciones = urlObj.searchParams.get('canciones');

          document.getElementById('comm-name').innerText = nombreMisa;
          document.getElementById('waiting-title').innerText = "Lista de Canciones de la Misa 🎶";
          
          if (idsCanciones) {
            const listaIds = idsCanciones.split(',');
            document.getElementById('status-text').innerText = `Contiene ${listaIds.length} elementos asignados.`;
            // Acá podrías cargar y listar las canciones en la web si lo deseas
          }
        } catch (e) {
          console.error("Error al procesar el deep link en la web", e);
        }

      } 
      // 2. SI ES UN LINK DE MODO VIVO (path=...)
      else {
        let path = "";
        if (hash.includes('path=')) {
          path = hash.split('path=')[1].split('&')[0];
        } else if (hash.startsWith('comunidades/')) {
          path = hash;
        }

        if (path) {
          start(path);
        } else {
          window.location.replace(FALLBACK);
        }
      }
    } else {
      window.location.replace(FALLBACK);
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      document.getElementById('theme-toggle-btn').innerText = isLight ? '🌙 Oscuro' : '☀️ Claro';
      try {
        localStorage.setItem('vivo_theme_mode', isLight ? 'light' : 'dark');
      } catch(e) {}
    }

    try {
      const savedTheme = localStorage.getItem('vivo_theme_mode');
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        const btn = document.getElementById('theme-toggle-btn');
        if (btn) btn.innerText = '🌙 Oscuro';
      }
    } catch(e) {}

    function start(path) {
      document.getElementById('loader').style.display='none';
      document.getElementById('main-view').style.display='block';

      // Sincronizar color primario litúrgico de la Parroquia en vivo
      db.ref(path + '/proyector_config').on('value', s => {
        const cfg = s.val();
        if (cfg) {
          if (cfg.colorTitulo || cfg.colorTexto) {
            const activeColor = cfg.colorTitulo || cfg.colorTexto || '#4DB6AC';
            document.documentElement.style.setProperty('--primary-light', activeColor);
            document.documentElement.style.setProperty('--primary', activeColor);
          }
        }
      });

      db.ref(path).on('value', s => {
        const d = s.val(); if (!d) return;
        document.getElementById('comm-name').innerText = d.nombre || "Comunidad";
        const lyricsDiv = document.getElementById('lyrics-display');
        const waitingDiv = document.getElementById('waiting-msg');
        const liveInd = document.getElementById('live-indicator');
        const waitTitle = document.getElementById('waiting-title');
        const statusText = document.getElementById('status-text');
        const blockIdx = parseInt(d.bloque_actual) || -1;
        
        if (!d.estado_vivo) { 
          liveInd.classList.remove('active'); liveInd.innerText = "● TRANSMISIÓN INACTIVA";
          waitingDiv.style.display='block'; lyricsDiv.style.display='none'; 
          waitTitle.innerText = "Te esperamos en la proxima celebración ⛪";
          statusText.innerText = "Próximamente en vivo o transmisión finalizada ⏳";
          return; 
        }

        liveInd.classList.add('active'); liveInd.innerText = "● TRANSMISIÓN EN VIVO";
        
        if (d.cancion_actual) {
          db.ref(`canciones_base/${d.cancion_actual}`).once('value', cs => {
            if (cs.exists()) mostrarContenido(cs.val().lyrics, -1, waitingDiv, lyricsDiv);
          });
        } else if (d.oracion_actual) {
          db.ref(`oraciones_oficiales/${d.oracion_actual}`).once('value', so => {
            if (so.exists()) mostrarContenido(so.val(), blockIdx, waitingDiv, lyricsDiv);
            else db.ref(`${path}/oraciones/${d.oracion_actual}`).once('value', sl => {
              if (sl.exists()) mostrarContenido(sl.val(), blockIdx, waitingDiv, lyricsDiv);
            });
          });
        } else if (d.lectura_actual_titulo) {
          const tipoTexto = d.lectura_actual_tipo ? ` (${d.lectura_actual_tipo})` : '';
          const titulo = d.lectura_actual_titulo || "Lectura de la Misa";
          const cuerpoTexto = d.lectura_actual_texto || "";

          if (cuerpoTexto) {
            console.log("🔍 [FIREBASE CRUDO]:\n", JSON.stringify(cuerpoTexto));

            // 1. Desempaquetar bloques principales por URL de referencia de curas.com.ar
            let rawBlocks = cuerpoTexto.split(/https?:\/\/[^\s]+/g);
            let cleanBlocks = [];

            rawBlocks.forEach(block => {
              let clean = block
                .replace(/##P_END##/g, "\n\n&nbsp;\n\n")
                .replace(/##BR##/g, "\n")
                .replace(/##PLUS##/g, "+ ")
                .replace(/<[^>]*>/g, "")
                .replace(/\{.*?\}/g, "")
                .replace(/\[.*?\]/g, "")
                .trim();

              clean = clean
                .replace(/^TIEMPO DURANTE EL AÑO\s*/gi, "")
                .replace(/^VIGESIMOCTAVA SEMANA\s*/gi, "")
                .replace(/^Año par\s*/gi, "")
                .replace(/^Año impar\s*/gi, "")
                .replace(/^(LUNES|MARTES|MIÉRCOLES|JUEVES|VIERNES|SÁBADO|DOMINGO)\s*/gi, "")
                .trim();

              if (clean.length > 5) cleanBlocks.push(clean);
            });

            // 2. Descartar la copia duplicada "Contenido Completo" del final
            if (cleanBlocks.length > 1) {
              const lastBlock = cleanBlocks[cleanBlocks.length - 1];
              const firstExcerpt = cleanBlocks[0].substring(0, 30);
              if (firstExcerpt.length > 8 && lastBlock.includes(firstExcerpt)) {
                cleanBlocks.pop();
              }
            }

            // 3. Mostrar ÚNICAMENTE la tarjeta seleccionada por bloque_actual
            let idxActivo = (blockIdx >= 0 && blockIdx < cleanBlocks.length) ? blockIdx : 0;
            const lecturaSeleccionada = cleanBlocks[idxActivo] || cleanBlocks[0] || titulo;

            console.log("🔍 [BLOQUE SELECCIONADO]:\n", JSON.stringify(lecturaSeleccionada));

            const cuerpoFormateado = darFormato(lecturaSeleccionada);

            console.log("🔍 [HTML RESULTANTE]:\n", cuerpoFormateado);

            const htmlLectura = `<b>📖 LECTURA EN VIVO${tipoTexto}</b><br><br><h2 style="color:var(--primary-light); margin:0 0 10px 0; font-size:1.3rem;">${titulo}</h2><div style="line-height:1.6; font-family:sans-serif;">${cuerpoFormateado}</div>`;
            mostrarHtmlDirecto(htmlLectura, waitingDiv, lyricsDiv);
          } else {
            const htmlLectura = `<b>📖 LECTURA EN VIVO${tipoTexto}</b><br><br><h2 style="color:var(--primary-light); margin:0; font-size:1.3rem;">${titulo}</h2><br><p style="font-size:0.95rem; opacity:0.85; line-height:1.5;">Proclamación de la Palabra de Dios en la Misa.</p>`;
            mostrarHtmlDirecto(htmlLectura, waitingDiv, lyricsDiv);
          }
        } else {
          waitingDiv.style.display='block'; lyricsDiv.style.display='none';
          waitTitle.innerText = "Cantemos Juntos 🎶";
          statusText.innerText = "🗣️ En breve iniciará el siguiente canto.";
        }
      });
    }

    function mostrarHtmlDirecto(html, waitingDiv, lyricsDiv) {
      waitingDiv.style.display='none'; lyricsDiv.style.display='block';
      lyricsDiv.innerHTML = `<div class="bloque">${html}</div>`;
      const activeEl = document.querySelector('.bloque.active');
      if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function mostrarContenido(data, blockIdx, waitingDiv, lyricsDiv) {
      waitingDiv.style.display='none'; lyricsDiv.style.display='block'; 
      let html = "";
      if (typeof data === 'string') {
        html = `<div class="bloque">${darFormato(data)}</div>`;
      } else {
        const bloques = data.contenido || [];
        html = bloques.map((b, i) => {
          const activeClass = (i === blockIdx) ? 'active' : '';
          let txt = b.texto || "";
          if (b.tipo === 'versiculo') txt = `<b>V.</b> ${txt}`;
          if (b.tipo === 'respuesta') txt = `<b>R.</b> ${txt}`;
          if (b.tipo === 'titulo_seccion') txt = `<b style="color:var(--primary-light)">${txt}</b>`;
          return `<div class="bloque ${activeClass}">${darFormato(txt)}</div>`;
        }).join('');
      }
      lyricsDiv.innerHTML = html;
      const activeEl = document.querySelector('.bloque.active');
      if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function darFormato(t) {
      if (!t) return "";
      let str = t
        .replace(/##P_END##/g, "\n\n&nbsp;\n\n")
        .replace(/##BR##/g, "\n")
        .replace(/##PLUS##/g, "+ ")
        .trim();

      // 1. Frases de Reflexión: Cursiva, letra chica (0.82em), alineada a la DERECHA, sin >
      str = str.replace(/(?:^|\n)(?:&gt;|>)\s*_?([\s\S]*?)_?(?=\n\n|\n[^\&\>]\w|$)/g, (match, content) => {
        let cleanQuote = content
          .replace(/(?:&gt;|>)\s*/g, '')
          .replace(/_/g, '')
          .replace(/\n/g, ' ')
          .trim();
        return `<div style="font-style: italic; font-size: 0.82em; color: var(--primary-light, #4DB6AC); margin: 6px 0 12px 0; opacity: 0.85; text-align: right;">${cleanQuote}</div>`;
      });

      // 2. Respuestas R. y Versículos V. en Negrita con color de acento
      str = str.replace(/(^|\s)R\.(?=\s|$|<)/g, '$1<b style="color:var(--primary-light, #4DB6AC);">R.</b>');
      str = str.replace(/(^|\s)V\.\s*/g, '$1<b style="color:var(--primary-light, #4DB6AC);">V. </b>');

      // 3. Formatear Negritas (**bold**), Cursivas (_italic_) y Markdown
      str = str
        .replace(/\{.*?\}/g, "")
        .replace(/\[.*?\]/g, "")
        .replace(/\*\*_([\s\S]*?)_\*\*/g, "<b><i>$1</i></b>")
        .replace(/\*\*([\s\S]*?)\*\*/g, "<b>$1</b>")
        .replace(/_([\s\S]*?)_/g, "<i>$1</i>");

      // 4. Detección de Poesía vs Prosa (Salmos, Antífonas, Aleluya, Secuencia, Cánticos)
      const isPoesia = str.includes("SALMO") ||
                       str.includes("Sal ") ||
                       str.includes("SECUENCIA") ||
                       str.includes("Secuencia") ||
                       str.includes("ALELUIA") ||
                       str.includes("Aleluia") ||
                       str.includes("Ant.") ||
                       str.includes("Antífona") ||
                       str.includes("Antifona") ||
                       str.includes("CÁNTICO") ||
                       str.includes("Cantico");

      if (isPoesia) {
        // === POESÍA (Salmos, Antífonas, Aleluya, Secuencia): Dividir por estrofas ===
        let rawBlocks = [];
        if (str.includes("&nbsp;") || str.includes("&amp;nbsp;")) {
          rawBlocks = str.split(/\n\s*(?:&nbsp;|&amp;nbsp;)\s*\n|\n{3,}/);
        } else {
          rawBlocks = str.split(/\n\s*\n\s*\n+/);
        }

        return rawBlocks.map(block => {
          let cleanBlock = block.replace(/&amp;nbsp;/g, " ").replace(/&nbsp;/g, " ").trim();
          if (!cleanBlock) return '';
          if (cleanBlock.startsWith('<div style="font-style: italic; font-size: 0.82em;')) return cleanBlock;

          let formattedLines = cleanBlock.replace(/\n+/g, '<br style="line-height:1.35;">');
          return `<div style="line-height: 1.45; margin-bottom: 1.25em; text-align: left;">${formattedLines}</div>`;
        }).join('');
      } else {
        // === PROSA (Primera Lectura, Segunda Lectura, Evangelio): Dividir por párrafos ===
        let cleanStr = str.replace(/&amp;nbsp;/g, " ").replace(/&nbsp;/g, " ").trim();
        let paragraphs = cleanStr.split(/\n\s*\n+/);

        return paragraphs.map(p => {
          let cleanP = p.trim();
          if (!cleanP) return '';
          if (cleanP.startsWith('<div style="font-style: italic; font-size: 0.82em;')) return cleanP;

          let formattedText = cleanP.replace(/\n+/g, ' ');
          return `<div style="line-height: 1.55; margin-bottom: 1.25em; text-align: left;">${formattedText}</div>`;
        }).join('');
      }
    }
    let zoom = 1.25;
    function changeZoom(v) { zoom = Math.min(Math.max(zoom + (v * 0.15), 0.9), 3.0); document.getElementById('lyrics-display').style.fontSize = zoom + 'rem'; }
  </script>
</body>
</html>
