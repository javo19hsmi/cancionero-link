<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consola del Operador de Proyector 🎛️</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: sans-serif; background: #121212; color: #E0E0E0;
      margin: 0; padding: 20px; box-sizing: border-box;
    }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00695C; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { color: #4DB6AC; margin: 0; font-size: 1.4rem; }
    .btn { background: #00695C; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .btn-red { background: #C62828; }
    .btn-amber { background: #FF8F00; color: #000; }
    .btn-blue { background: #0288D1; }
    .stanzas-list { display: flex; flex-direction: column; gap: 12px; }
    .stanza-card { background: #1E1E1E; border: 1px solid #333; padding: 15px; border-radius: 12px; cursor: pointer; transition: all 0.2s; white-space: pre-wrap; font-size: 1.1rem; line-height: 1.5; }
    .stanza-card:hover { background: #2A2A2A; border-color: #4DB6AC; }
    .stanza-card.active { background: #004D40; border-color: #80CBC4; font-weight: bold; color: #FFF; }
    .stanza-card b { color: #80CBC4; }
    .stanza-card i { font-style: italic; opacity: 0.9; }
    .transmision-info { background: #1E2827; border: 1px solid #00695C; padding: 10px 15px; border-radius: 10px; margin-bottom: 15px; font-size: 0.95rem; color: #80CBC4; }

    .design-panel { background: #1A1A1A; border: 1px solid #333; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
    .design-panel summary { font-weight: bold; color: #4DB6AC; cursor: pointer; font-size: 1.05rem; }
    .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
    .field-group { display: flex; flex-direction: column; gap: 5px; }
    .field-group label { font-size: 0.85rem; color: #AAA; font-weight: bold; }
    .field-group select, .field-group input { background: #2A2A2A; color: white; border: 1px solid #444; padding: 8px; border-radius: 6px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="parroquia-nombre">Consola Operador Proyector 🎛️</h1>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-blue" onclick="abrirProyectorCañon()">📽️ Abrir Pantalla Cañón (Monitor 2)</button>
      <button class="btn btn-amber" onclick="mostrarBienvenida()">⛪ BIENVENIDA</button>
      <button class="btn btn-red" onclick="mostrarNegra()">⬛ APAGÓN (NEGRA)</button>
    </div>
  </div>

  <div id="info-transmision" class="transmision-info">📡 Sintonizando señal del músico en vivo...</div>

  <!-- PANEL DESPLEGABLE DE PERSONALIZACIÓN -->
  <details class="design-panel">
    <summary>🎨 Personalización de Estilo del Proyector (Guardado en Nube)</summary>
    <div class="panel-grid">
      <div class="field-group">
        <label>Fondo del Proyector:</label>
        <select id="cfg-fondo" onchange="guardarEstiloConfig()">
          <option value="#050505">Negro Absoluto (Misa)</option>
          <option value="#0D1B2A">Azul Noche Litúrgico</option>
          <option value="#1B0024">Púrpura / Morado (Cuaresma/Adviento)</option>
          <option value="#002411">Verde Litúrgico</option>
          <option value="#00FF00">🟩 Modo OBS Chroma Key (Verde Transparente)</option>
          <option value="linear-gradient(135deg, #0D1B2A 0%, #000000 100%)">Degradado Azul a Negro</option>
          <option value="linear-gradient(135deg, #1B0024 0%, #000000 100%)">Degradado Borgoña a Negro</option>
        </select>
      </div>

      <div class="field-group">
        <label>Imagen de Fondo Propia (PC):</label>
        <input type="file" id="cfg-imagen-fondo" accept="image/*" onchange="cargarImagenFondo(event)">
      </div>

      <div class="field-group">
        <label>Tipografía:</label>
        <select id="cfg-fuente" onchange="guardarEstiloConfig()">
          <option value="'Helvetica Neue', Arial, sans-serif">Sans-Serif Limpia (Roboto/Arial)</option>
          <option value="'Georgia', 'Playfair Display', serif">Serif Elegante Litúrgica (Georgia/Playfair)</option>
          <option value="'Montserrat', 'Poppins', sans-serif">Redondeada Moderna (Montserrat)</option>
        </select>
      </div>

      <div class="field-group">
        <label>Tamaño de Letra Estrofas:</label>
        <select id="cfg-tamano" onchange="guardarEstiloConfig()">
          <option value="3.0rem">Pequeña (3.0rem)</option>
          <option value="3.8rem" selected>Mediana / Estándar (3.8rem)</option>
          <option value="4.5rem">Grande (4.5rem)</option>
          <option value="5.2rem">Gigante (5.2rem)</option>
        </select>
      </div>

      <div class="field-group">
        <label>Nombre Capilla/Parroquia:</label>
        <input type="text" id="cfg-nombre-parroquia" placeholder="Cargando nombre..." onchange="guardarEstiloConfig()">
      </div>

      <div class="field-group">
        <label>Mensaje de Bienvenida Personalizado:</label>
        <input type="text" id="cfg-bienvenida-msg" value="Bienvenidos a la Santa Misa 🕊️" onchange="guardarEstiloConfig()">
      </div>

      <div class="field-group">
        <label>Color Título Canción:</label>
        <input type="color" id="cfg-color-titulo" value="#4DB6AC" onchange="guardarEstiloConfig()">
      </div>

      <div class="field-group">
        <label>Color Texto Estrofas:</label>
        <input type="color" id="cfg-color-texto" value="#FFFFFF" onchange="guardarEstiloConfig()">
      </div>
    </div>
  </details>

  <div id="cancion-titulo" style="font-size:1.2rem; color:#FFD700; margin-bottom:15px; font-weight:bold;">Seleccioná una estrofa para proyectar al instante:</div>
  <div id="estrofas-container" class="stanzas-list">Esperando canción seleccionada en la App...</div>

  <script>
    firebase.initializeApp({
      databaseURL: "https://cancionero-parroquial-269d0-default-rtdb.firebaseio.com/"
    });
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    let comunidadPath = urlParams.get('comunidad') || 'comunidades/san_cayetano';
    if (!comunidadPath.startsWith('comunidades/')) comunidadPath = 'comunidades/' + comunidadPath;

    let cancionActualId = "";
    let estrofasList = [];
    let activeIdx = -1;
    let baseParroquiaNombre = "Parroquia";
    let customImageBg = "";

    function darFormato(t) {
      if (!t) return "";
      return t
        .replace(/\{.*?\}/g, "")
        .replace(/\[.*?\]/g, "")
        .replace(/\*\*_([\s\S]*?)_\*\*/g, "<i><b>$1</b></i>")
        .replace(/\*\*([\s\S]*?)\*\*/g, "<b>$1</b>")
        .replace(/_([\s\S]*?)_/g, "<i>$1</i>");
    }

    // Cargar configuración guardada en la Nube
    db.ref(comunidadPath + '/proyector_config').on('value', s => {
      const cfg = s.val();
      if (cfg) {
        if (cfg.fondo) document.getElementById('cfg-fondo').value = cfg.fondo;
        if (cfg.fuente) document.getElementById('cfg-fuente').value = cfg.fuente;
        if (cfg.tamano) document.getElementById('cfg-tamano').value = cfg.tamano;
        if (cfg.nombreParroquia) document.getElementById('cfg-nombre-parroquia').value = cfg.nombreParroquia;
        if (cfg.bienvenidaMsg) document.getElementById('cfg-bienvenida-msg').value = cfg.bienvenidaMsg;
        if (cfg.colorTitulo) document.getElementById('cfg-color-titulo').value = cfg.colorTitulo;
        if (cfg.colorTexto) document.getElementById('cfg-color-texto').value = cfg.colorTexto;
        if (cfg.imagenBg) customImageBg = cfg.imagenBg;
      }
    });

    function guardarEstiloConfig() {
      const cfg = {
        fondo: document.getElementById('cfg-fondo').value,
        fuente: document.getElementById('cfg-fuente').value,
        tamano: document.getElementById('cfg-tamano').value,
        nombreParroquia: document.getElementById('cfg-nombre-parroquia').value,
        bienvenidaMsg: document.getElementById('cfg-bienvenida-msg').value,
        colorTitulo: document.getElementById('cfg-color-titulo').value,
        colorTexto: document.getElementById('cfg-color-texto').value,
        imagenBg: customImageBg
      };
      db.ref(comunidadPath + '/proyector_config').set(cfg);
    }

    function cargarImagenFondo(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        customImageBg = e.target.result;
        guardarEstiloConfig();
        alert("¡Imagen de fondo cargada con éxito!");
      };
      reader.readAsDataURL(file);
    }

    db.ref(comunidadPath).on('value', snapshot => {
      const d = snapshot.val();
      if (!d) return;
      baseParroquiaNombre = d.nombre || 'Parroquia';
      document.getElementById('parroquia-nombre').innerText = baseParroquiaNombre + " - Operador";

      const nombreInput = document.getElementById('cfg-nombre-parroquia');
      if (!nombreInput.value) {
        nombreInput.value = baseParroquiaNombre;
      }

      const infoBox = document.getElementById('info-transmision');
      if (d.estado_vivo) {
        infoBox.innerHTML = `🟢 <b>Misa en Vivo ACTIVA</b> · Transmitiendo para la asamblea`;
      } else {
        infoBox.innerHTML = `⚪ <b>Misa en Vivo INACTIVA</b> · Tocá "Transmitir" en la App para emitir`;
      }

      if (d.cancion_actual && d.cancion_actual !== cancionActualId) {
        cancionActualId = d.cancion_actual;
        cargarCancion(cancionActualId);
      } else if (!d.cancion_actual) {
        document.getElementById('estrofas-container').innerHTML = `<div style="text-align:center; padding:30px; color:#888;">El músico no ha seleccionado ninguna canción aún.<br>Abrí cualquier canción en la App para ver las estrofas aquí.</div>`;
      }
    });

    function cargarCancion(id) {
      db.ref(`canciones_base/${id}`).once('value', s => {
        if (!s.exists()) return;
        const c = s.val();
        document.getElementById('cancion-titulo').innerText = "🎶 Canción Activa: " + (c.title || "Canción en Vivo");
        const lyrics = (c.lyrics || "").replace(/\{.*?\}/g, "").replace(/\[.*?\]/g, "").trim();
        estrofasList = lyrics.split(/\n\s*\n/).filter(x => x.trim().length > 0);
        renderEstrofas(c.title || "Canción");
      });
    }

    function renderEstrofas(titulo) {
      const container = document.getElementById('estrofas-container');
      if (estrofasList.length === 0) {
        container.innerHTML = "No hay letra disponible para esta canción.";
        return;
      }
      container.innerHTML = estrofasList.map((e, idx) => `
        <div class="stanza-card ${idx === activeIdx ? 'active' : ''}" onclick="proyectarEstrofa('${titulo.replace(/'/g, "\\'")}', ${idx})">
          <small style="color:#80CBC4">Estrofa ${idx + 1}:</small><br>${darFormato(e.trim())}
        </div>
      `).join('');
    }

    function proyectarEstrofa(titulo, idx) {
      activeIdx = idx;
      renderEstrofas(titulo);
      const nombreParroquia = document.getElementById('cfg-nombre-parroquia').value.trim();
      db.ref(comunidadPath + '/proyeccion_vivo').set({
        modo: 'CANCCION',
        titulo: titulo,
        bloqueTexto: estrofasList[idx],
        bloqueIndex: idx,
        totalBloques: estrofasList.length,
        comunidadNombre: nombreParroquia
      });
    }

    function mostrarBienvenida() {
      activeIdx = -1;
      const nombreParroquia = document.getElementById('cfg-nombre-parroquia').value.trim();
      const bienvenidaMsg = document.getElementById('cfg-bienvenida-msg').value.trim() || 'Bienvenidos a la Santa Misa 🕊️';
      db.ref(comunidadPath + '/proyeccion_vivo').set({
        modo: 'BIENVENIDA',
        titulo: bienvenidaMsg,
        bloqueTexto: nombreParroquia,
        bloqueIndex: 0,
        totalBloques: 1,
        comunidadNombre: nombreParroquia
      });
    }

    function mostrarNegra() {
      activeIdx = -1;
      const nombreParroquia = document.getElementById('cfg-nombre-parroquia').value.trim();
      db.ref(comunidadPath + '/proyeccion_vivo').set({
        modo: 'NEGRA',
        titulo: '',
        bloqueTexto: '',
        bloqueIndex: 0,
        totalBloques: 0,
        comunidadNombre: nombreParroquia
      });
    }

    function abrirProyectorCañon() {
      window.open('proyector.html?comunidad=' + encodeURIComponent(comunidadPath), '_blank', 'width=1280,height=720');
    }
  </script>
</body>
</html>
