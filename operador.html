<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consola del Operador de Proyector 🎛️</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: sans-serif; background: #121212; color: #E0E0E0;
      margin: 0; padding: 20px; box-sizing: border-box;
    }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00695C; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { color: #4DB6AC; margin: 0; font-size: 1.5rem; }
    .btn { background: #00695C; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
    .btn-red { background: #C62828; }
    .btn-amber { background: #FF8F00; color: #000; }
    .grid-actions { display: flex; gap: 12px; margin-bottom: 20px; }
    .stanzas-list { display: flex; flex-direction: column; gap: 12px; }
    .stanza-card { background: #1E1E1E; border: 1px solid #333; padding: 15px; border-radius: 12px; cursor: pointer; transition: all 0.2s; white-space: pre-wrap; font-size: 1.1rem; line-height: 1.5; }
    .stanza-card:hover { background: #2A2A2A; border-color: #4DB6AC; }
    .stanza-card.active { background: #004D40; border-color: #80CBC4; font-weight: bold; color: #FFF; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="parroquia-nombre">Consola Operador Proyector 🎛️</h1>
    <div>
      <button class="btn btn-amber" onclick="mostrarBienvenida()">⛪ BIENVENIDA</button>
      <button class="btn btn-red" onclick="mostrarNegra()">⬛ PANTALLA NEGRA</button>
    </div>
  </div>

  <div id="cancion-titulo" style="font-size:1.3rem; color:#FFD700; margin-bottom:15px; font-weight:bold;">Seleccioná una estrofa para proyectar al instante:</div>
  <div id="estrofas-container" class="stanzas-list">Cargando estrofas...</div>

  <script>
    firebase.initializeApp({ databaseURL: "https://cancionero-parroquial-269d0-default-rtdb.firebaseio.com/" });
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    let comunidadPath = urlParams.get('comunidad') || 'comunidades/san_cayetano';
    if (!comunidadPath.startsWith('comunidades/')) comunidadPath = 'comunidades/' + comunidadPath;

    let cancionActualId = "";
    let estrofasList = [];
    let activeIdx = -1;

    db.ref(comunidadPath).on('value', snapshot => {
      const d = snapshot.val();
      if (!d) return;
      document.getElementById('parroquia-nombre').innerText = (d.nombre || 'Parroquia') + " - Operador Proyector";

      if (d.cancion_actual && d.cancion_actual !== cancionActualId) {
        cancionActualId = d.cancion_actual;
        cargarCancion(cancionActualId);
      }
    });

    function cargarCancion(id) {
      db.ref(`canciones_base/${id}`).once('value', s => {
        if (!s.exists()) return;
        const c = s.val();
        document.getElementById('cancion-titulo').innerText = "🎶 " + (c.title || "Canción en Vivo");
        const lyrics = (c.lyrics || "").replace(/\[.*?\]/g, "").trim();
        estrofasList = lyrics.split(/\n\s*\n/).filter(x => x.trim().length > 0);
        renderEstrofas(c.title || "Canción");
      });
    }

    function renderEstrofas(titulo) {
      const container = document.getElementById('estrofas-container');
      container.innerHTML = estrofasList.map((e, idx) => `
        <div class="stanza-card ${idx === activeIdx ? 'active' : ''}" onclick="proyectarEstrofa('${titulo.replace(/'/g, "\\'")}', ${idx})">
          <small style="color:#80CBC4">Estrofa ${idx + 1}:</small><br>${e.trim()}
        </div>
      `).join('');
    }

    function proyectarEstrofa(titulo, idx) {
      activeIdx = idx;
      renderEstrofas(titulo);
      db.ref(comunidadPath + '/proyeccion_vivo').set({
        modo: 'CANCCION',
        titulo: titulo,
        bloqueTexto: estrofasList[idx],
        bloqueIndex: idx,
        totalBloques: estrofasList.length,
        comunidadNombre: document.getElementById('parroquia-nombre').innerText
      });
    }

    function mostrarBienvenida() {
      activeIdx = -1;
      db.ref(comunidadPath + '/proyeccion_vivo').set({
        modo: 'BIENVENIDA',
        titulo: 'Bienvenidos a la Santa Misa 🕊️',
        bloqueTexto: document.getElementById('parroquia-nombre').innerText,
        bloqueIndex: 0,
        totalBloques: 1,
        comunidadNombre: document.getElementById('parroquia-nombre').innerText
      });
    }

    function mostrarNegra() {
      activeIdx = -1;
      db.ref(comunidadPath + '/proyeccion_vivo').set({
        modo: 'NEGRA',
        titulo: '',
        bloqueTexto: '',
        bloqueIndex: 0,
        totalBloques: 0,
        comunidadNombre: document.getElementById('parroquia-nombre').innerText
      });
    }
  </script>
</body>
</html>
